name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ceiromaniamappathfinder/ai-pathfinder-web

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Record the currently live commit
        id: live
        env:
          HEALTH_URL: ${{ vars.PUBLIC_HEALTH_URL }}
        run: |
          live=$(curl -sf --max-time 5 "$HEALTH_URL" \
            | sed -n 's/.*"commit"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p') || true
          echo "sha=$live" >> "$GITHUB_OUTPUT"
          if [ -n "$live" ]; then
            echo "Currently live: $live"
          else
            echo "Nothing is live right now, so there is no rollback target."
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Test before shipping
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy
        id: trigger
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::error::Secret DOKPLOY_DEPLOY_WEBHOOK is not set."
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$WEBHOOK" > /dev/null
          echo "Deploy triggered."

      - name: Wait for this commit to go live
        env:
          HEALTH_URL: ${{ vars.PUBLIC_HEALTH_URL }}
          EXPECTED: ${{ github.sha }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::error::Repo variable PUBLIC_HEALTH_URL is not set (e.g. https://your-domain/api/build-info)."
            exit 1
          fi
          for i in $(seq 1 60); do
            live=$(curl -sf --max-time 5 "$HEALTH_URL" \
              | sed -n 's/.*"commit"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
            if [ "$live" = "$EXPECTED" ]; then
              echo "Live on $EXPECTED after $((i * 5))s."
              exit 0
            fi
            echo "attempt $i/60 — live=${live:-<no response>}"
            sleep 5
          done
          echo "::error::$EXPECTED did not go live within 300s. Last seen: ${live:-<no response>}"
          exit 1

      - name: Roll back to the last live commit
        if: failure() && steps.trigger.outcome == 'success' && steps.live.outputs.sha != ''
        env:
          PREV: ${{ steps.live.outputs.sha }}
          WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
          HEALTH_URL: ${{ vars.PUBLIC_HEALTH_URL }}
        run: |
          echo "Rolling back to $PREV."
          docker buildx imagetools create -t "$IMAGE:main" "$IMAGE:sha-$PREV"
          curl --fail --silent --show-error -X POST "$WEBHOOK" > /dev/null
          for i in $(seq 1 36); do
            live=$(curl -sf --max-time 5 "$HEALTH_URL" \
              | sed -n 's/.*"commit"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p') || true
            if [ "$live" = "$PREV" ]; then
              echo "Rolled back to $PREV after $((i * 5))s."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Rollback to $PREV did not come live within 180s. Redeploy $IMAGE:sha-$PREV from the Dokploy UI."
          exit 1

      - name: Rollback hint
        if: failure() && (steps.trigger.outcome != 'success' || steps.live.outputs.sha == '')
        run: |
          echo "Deploy failed before anything was rolled out, or there was nothing live to roll back to."
          echo "If the app is down, redeploy a known-good tag from the Dokploy UI:"
          echo "  ${{ env.IMAGE }}:sha-<previous-commit-sha>"
